services:
  api:
    build: .

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/banco
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: senha

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: senha
      MYSQL_DATABASE: banco

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psenha"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s