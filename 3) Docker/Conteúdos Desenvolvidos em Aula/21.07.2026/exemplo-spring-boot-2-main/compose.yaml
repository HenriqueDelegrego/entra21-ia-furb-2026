services:
  api:
    build: .

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/banco
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: senha

  db:
    image: mysql

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: senha
      MYSQL_DATABASE: banco